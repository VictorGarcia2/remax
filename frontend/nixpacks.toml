# Nixpacks configuration for REMAX Frontend
# This file is automatically read by Nixpacks during deployment on Easypanel.

[variables]
  NODE_ENV = "production"

[phases.setup]
  # Tell Nixpacks to use Node.js
  nixPkgs = ["...", "nodejs"]

[phases.build]
  # Build the production assets of the Vite application
  cmds = ["npm run build"]

[start]
  # Start our optimized static web server
  cmd = "npm run start"
