# Nixpacks configuration for REMAX FastAPI & Scrapers

providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "chromium", "glib", "pango", "harfbuzz", "cairo"]

[phases.install]
cmds = [
    "pip install --no-cache-dir -r requirements.txt",
    "playwright install chromium"
]

[start]
cmd = "gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:8000"
