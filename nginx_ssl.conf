server {
    listen 80;
    server_name remaxcin.com www.remaxcin.com;
    
    # Redirección HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name remaxcin.com www.remaxcin.com;

    # Certificados SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/remaxcin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remaxcin.com/privkey.pem;
    
    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Otras cabeceras de seguridad
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/remaxcin/frontend/dist;
    index index.html;

    # Archivos estáticos con compresión
    location / {
        try_files $uri $uri/ /index.html;
        
        # Compresión gzip
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/xml+rss
            application/json;
    }

    # Archivos estáticos con cache largo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Sitemap y robots.txt
    location = /sitemap.xml { 
        try_files $uri =404;
        expires 1d;
    }
    location = /robots.txt { 
        try_files $uri =404;
        expires 1d;
    }

    # CSV de propiedades
    location = /propiedades.csv {
        try_files $uri =404;
        expires 1h;
        add_header Content-Type "text/csv";
        add_header Content-Disposition "attachment; filename=propiedades.csv";
    }

    # Backend API (si tienes)
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Bloquear acceso a archivos sensibles
    location ~* /\.(git|env|htaccess|vscode|DS_Store)$ {
        deny all;
    }

    location ~* /(node_modules|src|backend)/ {
        deny all;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    # Logs
    access_log /var/log/nginx/remaxcin_access.log;
    error_log /var/log/nginx/remaxcin_error.log;
}
